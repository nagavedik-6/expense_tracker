{% extends 'base.html' %}

{% block title %}Delete Category — FinSmart{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card-glass text-center py-5">
            <div class="text-danger mb-4">
                <i class="bi bi-exclamation-triangle-fill" style="font-size: 64px;"></i>
            </div>
            
            <h2 class="h3 mb-3">Delete Category?</h2>
            <p class="text-secondary mb-4">Are you sure you want to delete the custom category "<strong>{{ category.name }}</strong>"?<br>Expenses in this category will be marked as uncategorized.</p>
            
            <form method="POST">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url 'category_list' %}" class="btn btn-outline-secondary px-4 py-2">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4 py-2">Yes, Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
